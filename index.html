<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26293A">
<meta name="description" content="매일 배운 영어 단어, 숙어, 문장을 말로 기록하는 학습 노트">
<title>데일리 보이스 노트</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="보이스노트">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper: #F1ECDE;
    --paper-card: #FFFDF6;
    --ink: #26293A;
    --ink-soft: #5C5F72;
    --teal: #1F5F5B;
    --teal-soft: #E4EEEC;
    --amber: #D9962F;
    --amber-soft: #FBEDD6;
    --coral: #C85A45;
    --coral-soft: #F7E3DE;
    --line: #DCD3BC;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overscroll-behavior-y: none;
  }

  .app {
    max-width: 440px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }

  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 18px;
  }
  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--teal);
    font-weight: 700;
    text-transform: uppercase;
  }
  .app-header h1 {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 600;
    margin: 2px 0 0;
    line-height: 1.2;
  }
  .streak-badge {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 999px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .view-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .view-tab {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .view-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .composer {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 18px;
    box-shadow: 0 2px 10px rgba(38,41,58,0.05);
  }

  .tabs, .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .tab, .filter {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .tab.active[data-cat="단어"], .filter.active[data-filter="단어"] { background: var(--teal); color: #fff; border-color: var(--teal); }
  .tab.active[data-cat="숙어"], .filter.active[data-filter="숙어"] { background: var(--amber); color: #fff; border-color: var(--amber); }
  .tab.active[data-cat="문장"], .filter.active[data-filter="문장"] { background: var(--coral); color: #fff; border-color: var(--coral); }
  .filter.active[data-filter="전체"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .mic-btn {
    position: relative;
    width: 46px;
    height: 46px;
    min-width: 46px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: var(--paper);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mic-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .mic-btn .mic-rings {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid var(--coral);
    opacity: 0;
  }
  .mic-btn.recording { background: var(--coral); }
  .mic-btn.recording .mic-rings {
    opacity: 1;
    animation: pulse-ring 1.1s ease-out infinite;
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.9); opacity: 0.7; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  #textInput, #memoInput {
    width: 100%;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 10px;
    padding: 12px 13px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    color: var(--ink);
  }
  #textInput { flex: 1; }
  #memoInput { margin-bottom: 12px; font-size: 13.5px; color: var(--ink-soft); }
  #textInput:focus, #memoInput:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

  .save-btn {
    width: 100%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 13px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 14.5px;
    cursor: pointer;
  }
  .save-btn:active { transform: scale(0.99); }

  .mic-status {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    min-height: 16px;
    margin: 8px 0 0;
  }

  .notebook {
    position: relative;
    padding-left: 16px;
  }
  .notebook::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 4px;
    bottom: 4px;
    width: 1px;
    background-image: radial-gradient(var(--line) 1.4px, transparent 1.6px);
    background-size: 100% 14px;
  }

  .date-heading {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
    margin: 22px 0 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .date-heading:first-child { margin-top: 6px; }
  .date-heading::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .entry-card {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--teal);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    position: relative;
  }
  .entry-card[data-cat="숙어"] { border-left-color: var(--amber); }
  .entry-card[data-cat="문장"] { border-left-color: var(--coral); }

  .entry-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .entry-tag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
    color: var(--teal);
    background: var(--teal-soft);
  }
  .entry-card[data-cat="숙어"] .entry-tag { color: var(--amber); background: var(--amber-soft); }
  .entry-card[data-cat="문장"] .entry-tag { color: var(--coral); background: var(--coral-soft); }

  .entry-text {
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
    line-height: 1.4;
    margin: 0 0 4px;
    word-break: break-word;
  }
  .entry-memo { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .entry-time { font-size: 11px; color: var(--ink-soft); opacity: 0.7; white-space: nowrap; margin-top: 2px; }
  .delete-btn {
    border: none;
    background: transparent;
    color: var(--ink-soft);
    font-size: 15px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
    opacity: 0.55;
  }
  .delete-btn:hover { opacity: 1; }

  .entry-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }
  .listen-btn {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 12px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
  }
  .listen-btn:active { transform: scale(0.98); }

  .pron-panel {
    margin-top: 8px;
    background: var(--teal-soft);
    border: 1px solid var(--teal);
    border-radius: 10px;
    padding: 10px 12px;
    display: none;
  }
  .pron-playall {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--teal);
    color: #fff;
    border: none;
    font-size: 11.5px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
    margin-bottom: 6px;
  }
  .pron-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
  }
  .pron-flag { font-size: 14px; }
  .pron-label { font-size: 11.5px; color: var(--ink-soft); min-width: 44px; }
  .pron-ipa {
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--teal);
    font-size: 14px;
    flex: 1;
  }
  .pron-play {
    width: 26px;
    height: 26px;
    min-width: 26px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    color: #fff;
    font-size: 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pron-note { font-size: 11.5px; color: var(--ink-soft); }
  .pron-core {
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    margin: 8px 0 6px;
    padding-top: 8px;
    border-top: 1px dashed var(--line);
  }
  .pron-pos {
    font-size: 12px;
    font-weight: 700;
    color: var(--teal);
    background: #fff;
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    margin: 6px 0 4px;
  }
  .pron-def { font-size: 13px; color: var(--ink); margin: 2px 0 2px 4px; line-height: 1.4; }
  .pron-thesaurus { font-size: 12px; margin-top: 8px; color: var(--ink-soft); line-height: 1.5; }
  .pron-thesaurus b { color: var(--ink); }
  .pron-loading { font-size: 12.5px; color: var(--ink-soft); }

  .empty-state { text-align: center; padding: 40px 12px; color: var(--ink-soft); }
  .empty-state .big { font-family: 'Fraunces', serif; font-size: 17px; color: var(--ink); margin-bottom: 4px; }

  .footer-reset { text-align: center; margin-top: 26px; }
  .footer-reset button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  .install-hint {
    display: none;
    background: var(--teal-soft);
    border: 1px solid var(--teal);
    color: var(--teal);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .install-hint.show { display: block; }

  /* Review / flashcard */
  .review-progress {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .flashcard {
    background: var(--paper-card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 30px 18px;
    text-align: center;
    min-height: 170px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .flashcard-cat {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--teal);
    background: var(--teal-soft);
    padding: 3px 10px;
    border-radius: 999px;
  }
  .flashcard-kr {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    line-height: 1.45;
    color: var(--ink);
  }
  .flashcard-en {
    font-family: 'Fraunces', serif;
    font-size: 16.5px;
    color: var(--coral);
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    width: 100%;
    display: none;
  }
  .flip-btn {
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .review-nav {
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .review-nav button {
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .review-empty {
    text-align: center;
    color: var(--ink-soft);
    padding: 30px 10px;
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div>
      <div class="eyebrow">Daily Voice Notes</div>
      <h1>데일리 보이스 노트</h1>
    </div>
    <div class="streak-badge" id="streakBadge">🔥 0일</div>
  </header>

  <div class="install-hint" id="installHint">홈 화면에 추가하면 앱처럼 아이콘으로 열 수 있어요. 오른쪽 위 메뉴(⋮) → "앱 설치" 또는 "홈 화면에 추가"를 눌러보세요.</div>

  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="note">노트</button>
    <button class="view-tab" data-view="review">복습</button>
  </div>

  <div id="noteView">
    <section class="composer">
      <div class="tabs" id="categoryTabs">
        <button class="tab active" data-cat="단어">단어</button>
        <button class="tab" data-cat="숙어">숙어</button>
        <button class="tab" data-cat="문장">문장</button>
      </div>

      <div class="input-row">
        <button class="mic-btn" id="micBtn" aria-label="음성으로 입력">
          <span class="mic-rings"></span>
          <span id="micIcon">🎙️</span>
        </button>
        <input id="textInput" type="text" placeholder="오늘 배운 단어·숙어·문장" />
      </div>
      <input id="memoInput" type="text" placeholder="뜻이나 메모 (선택)" />
      <button class="save-btn" id="saveBtn">노트에 기록하기</button>
      <p class="mic-status" id="micStatus"></p>
    </section>

    <section class="filters" id="filterTabs">
      <button class="filter active" data-filter="전체">전체</button>
      <button class="filter" data-filter="단어">단어</button>
      <button class="filter" data-filter="숙어">숙어</button>
      <button class="filter" data-filter="문장">문장</button>
    </section>

    <section class="notebook" id="entryList"></section>

    <div class="footer-reset">
      <button id="resetBtn">모든 기록 삭제</button>
    </div>
  </div>

  <div id="reviewView" style="display:none;">
    <section class="filters" id="reviewFilterTabs">
      <button class="filter active" data-filter="전체">전체</button>
      <button class="filter" data-filter="단어">단어</button>
      <button class="filter" data-filter="숙어">숙어</button>
      <button class="filter" data-filter="문장">문장</button>
    </section>

    <div class="review-progress" id="reviewProgress"></div>

    <div class="flashcard" id="flashcard">
      <div class="flashcard-cat" id="flashcardCat"></div>
      <div class="flashcard-kr" id="flashcardKr">-</div>
      <div class="flashcard-en" id="flashcardEn"></div>
      <button class="flip-btn" id="flipBtn">정답 보기</button>
    </div>

    <div class="review-nav">
      <button id="prevBtn">◀ 이전</button>
      <button id="shuffleBtn">🔀 섞기</button>
      <button id="nextBtn">다음 ▶</button>
    </div>

    <div class="review-empty" id="reviewEmpty" style="display:none;">복습할 기록이 없어요. 노트 탭에서 먼저 기록해보세요.</div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'voice-notes-entries';
  const DICT_CACHE_KEY = 'voice-notes-dict-cache-v1';
  const TR_CACHE_KEY = 'voice-notes-tr-cache-v1';

  const POS_KR = {
    noun: '명사', verb: '동사', adjective: '형용사', adverb: '부사',
    pronoun: '대명사', preposition: '전치사', conjunction: '접속사',
    interjection: '감탄사', exclamation: '감탄사', determiner: '한정사',
    article: '관사', numeral: '수사'
  };
  function posLabel(pos){ return POS_KR[pos] || pos; }

  let entries = [];
  let activeCat = '단어';
  let activeFilter = '전체';
  let currentView = 'note';

  const textInput = document.getElementById('textInput');
  const memoInput = document.getElementById('memoInput');
  const saveBtn = document.getElementById('saveBtn');
  const micBtn = document.getElementById('micBtn');
  const micIcon = document.getElementById('micIcon');
  const micStatus = document.getElementById('micStatus');
  const entryList = document.getElementById('entryList');
  const streakBadge = document.getElementById('streakBadge');
  const resetBtn = document.getElementById('resetBtn');
  const installHint = document.getElementById('installHint');
  const noteView = document.getElementById('noteView');
  const reviewView = document.getElementById('reviewView');

  document.getElementById('categoryTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn) return;
    activeCat = btn.dataset.cat;
    document.querySelectorAll('#categoryTabs .tab').forEach(t => t.classList.toggle('active', t === btn));
  });

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('#filterTabs .filter').forEach(t => t.classList.toggle('active', t === btn));
    render();
  });

  document.getElementById('viewTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.view-tab');
    if (!btn) return;
    currentView = btn.dataset.view;
    document.querySelectorAll('.view-tab').forEach(t => t.classList.toggle('active', t === btn));
    if (currentView === 'note') {
      noteView.style.display = '';
      reviewView.style.display = 'none';
    } else {
      noteView.style.display = 'none';
      reviewView.style.display = '';
      buildReviewOrder();
      renderFlashcard();
    }
  });

  function pad(n){ return n.toString().padStart(2,'0'); }

  function todayKey(d){
    d = d || new Date();
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  }

  function formatDateHeading(key){
    const [y,m,d] = key.split('-').map(Number);
    const date = new Date(y, m-1, d);
    const now = new Date();
    const todayStr = todayKey(now);
    const yesterday = new Date(now); yesterday.setDate(now.getDate()-1);
    const yStr = todayKey(yesterday);
    const label = `${m}월 ${d}일`;
    if (key === todayStr) return `${label} · 오늘`;
    if (key === yStr) return `${label} · 어제`;
    const weekday = ['일','월','화','수','목','금','토'][date.getDay()];
    return `${label} (${weekday})`;
  }

  function loadEntries(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch(e) { return []; }
  }
  function saveEntries(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
  }

  function computeStreak(){
    if (entries.length === 0) return 0;
    const dateSet = new Set(entries.map(e => e.date));
    let streak = 0;
    let cursor = new Date();
    if (!dateSet.has(todayKey(cursor))) cursor.setDate(cursor.getDate()-1);
    while (dateSet.has(todayKey(cursor))) { streak++; cursor.setDate(cursor.getDate()-1); }
    return streak;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function isWordLookupEligible(entry){
    return entry.category === '단어' && !/\s/.test(entry.text.trim());
  }

  function render(){
    streakBadge.textContent = `🔥 ${computeStreak()}일`;

    const filtered = activeFilter === '전체' ? entries : entries.filter(e => e.category === activeFilter);

    if (filtered.length === 0) {
      entryList.innerHTML = `
        <div class="empty-state">
          <div class="big">아직 기록이 없어요</div>
          <div>오늘 배운 표현을 첫 줄로 남겨보세요.</div>
        </div>`;
      return;
    }

    const sorted = [...filtered].sort((a,b) => b.createdAt - a.createdAt);
    const groups = {};
    sorted.forEach(e => {
      if (!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });

    let html = '';
    Object.keys(groups).sort((a,b) => b.localeCompare(a)).forEach(dateKey => {
      html += `<div class="date-heading">${formatDateHeading(dateKey)}</div>`;
      groups[dateKey].forEach(e => {
        const time = new Date(e.createdAt);
        const timeStr = `${pad(time.getHours())}:${pad(time.getMinutes())}`;
        const btnLabel = isWordLookupEligible(e) ? '📖 사전 보기' : '🔊 읽어주기';
        html += `
          <div class="entry-card" data-cat="${e.category}">
            <div class="entry-top">
              <div>
                <span class="entry-tag">${e.category}</span>
                <p class="entry-text">${escapeHtml(e.text)}</p>
                ${e.memo ? `<p class="entry-memo">${escapeHtml(e.memo)}</p>` : ''}
              </div>
              <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
                <button class="delete-btn" data-id="${e.id}" aria-label="삭제">✕</button>
                <span class="entry-time">${timeStr}</span>
              </div>
            </div>
            <div class="entry-actions">
              <button class="listen-btn" data-id="${e.id}">${btnLabel}</button>
            </div>
            <div class="pron-panel" id="pron-${e.id}"></div>
          </div>`;
      });
    });
    entryList.innerHTML = html;
  }

  saveBtn.addEventListener('click', () => {
    const text = textInput.value.trim();
    if (!text) { textInput.focus(); return; }
    const memo = memoInput.value.trim();
    const now = Date.now();
    entries.push({
      id: `${now}-${Math.random().toString(36).slice(2,8)}`,
      category: activeCat, text, memo,
      date: todayKey(new Date(now)),
      createdAt: now
    });
    saveEntries();
    textInput.value = '';
    memoInput.value = '';
    render();
  });

  textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveBtn.click(); });

  // ---------- Speech recognition (input) ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isRecording = false;

  if (SR) {
    recognition = new SR();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('recording');
      micIcon.textContent = '⏹️';
      micStatus.textContent = '듣고 있어요... 영어로 말해보세요';
    };
    recognition.onresult = (e) => { textInput.value = e.results[0][0].transcript; };
    recognition.onerror = (e) => {
      micStatus.textContent = e.error === 'not-allowed'
        ? '마이크 권한이 필요해요. 브라우저 설정을 확인해주세요.'
        : '음성 인식에 실패했어요. 다시 시도해주세요.';
    };
    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove('recording');
      micIcon.textContent = '🎙️';
      if (!micStatus.textContent.includes('필요') && !micStatus.textContent.includes('실패')) {
        micStatus.textContent = '';
      }
    };

    micBtn.addEventListener('click', () => {
      if (isRecording) recognition.stop();
      else { try { recognition.start(); } catch(e) {} }
    });
  } else {
    micBtn.disabled = true;
    micStatus.textContent = '이 브라우저는 음성 인식을 지원하지 않아요. 텍스트로 입력해주세요.';
  }

  // ---------- Caches ----------
  function getCache(key){
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : {}; }
    catch(e) { return {}; }
  }
  function saveCache(key, obj){
    try { localStorage.setItem(key, JSON.stringify(obj)); } catch(e) {}
  }

  // ---------- Translation (MyMemory, free, no key) ----------
  async function translateToKorean(text){
    const clean = text.trim();
    if (!clean) return null;
    const cache = getCache(TR_CACHE_KEY);
    const key = clean.toLowerCase();
    if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key];
    try {
      const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=en|ko`);
      const data = await res.json();
      const translated = data && data.responseData && data.responseData.translatedText
        ? data.responseData.translatedText : null;
      cache[key] = translated;
      saveCache(TR_CACHE_KEY, cache);
      return translated;
    } catch(e) {
      return null;
    }
  }

  // ---------- Dictionary lookup (dictionaryapi.dev, free, no key) ----------
  function guessAccent(url){
    const u = (url || '').toLowerCase();
    if (u.includes('-us.') || u.includes('_us.') || u.includes('/us/')) return { flag: '🇺🇸', label: '미국식' };
    if (u.includes('-uk.') || u.includes('_uk.') || u.includes('/uk/') || u.includes('-gb.')) return { flag: '🇬🇧', label: '영국식' };
    return { flag: '🔊', label: '발음' };
  }

  async function lookupWord(word){
    const key = word.toLowerCase();
    const cache = getCache(DICT_CACHE_KEY);
    if (Object.prototype.hasOwnProperty.call(cache, key)) return cache[key];

    try {
      const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
      if (!res.ok) { cache[key] = null; saveCache(DICT_CACHE_KEY, cache); return null; }
      const data = await res.json();
      const entry = data[0];
      const seen = new Set();
      const phonetics = (entry.phonetics || [])
        .filter(p => p.audio)
        .map(p => ({ text: p.text || entry.phonetic || '', audio: p.audio, accent: guessAccent(p.audio) }))
        .filter(p => { if (seen.has(p.audio)) return false; seen.add(p.audio); return true; });

      const meanings = (entry.meanings || []).map(m => ({
        partOfSpeech: m.partOfSpeech,
        definitions: (m.definitions || []).map(d => d.definition).filter(Boolean),
        synonyms: [...new Set([...(m.synonyms || []), ...(m.definitions || []).flatMap(d => d.synonyms || [])])],
        antonyms: [...new Set([...(m.antonyms || []), ...(m.definitions || []).flatMap(d => d.antonyms || [])])]
      }));

      const result = {
        phonetic: entry.phonetic || (phonetics[0] && phonetics[0].text) || '',
        phonetics,
        meanings
      };
      cache[key] = result;
      saveCache(DICT_CACHE_KEY, cache);
      return result;
    } catch(e) {
      return undefined; // network error — do not cache
    }
  }

  function speak(text, lang){
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang || 'en-US';
      window.speechSynthesis.speak(u);
    } catch(e) {}
  }

  function playSequentially(urls, i){
    i = i || 0;
    if (i >= urls.length) return;
    const audio = new Audio(urls[i]);
    audio.addEventListener('ended', () => playSequentially(urls, i+1));
    audio.play().catch(() => playSequentially(urls, i+1));
  }

  async function buildDictPanelHtml(entry, dict){
    let html = '';

    if (dict.phonetics && dict.phonetics.length > 0) {
      if (dict.phonetics.length > 1) html += `<button class="pron-playall">⏵ 전체재생</button>`;
      html += dict.phonetics.map(p => `
        <div class="pron-row">
          <span class="pron-flag">${p.accent.flag}</span>
          <span class="pron-label">${p.accent.label}</span>
          <span class="pron-ipa">${escapeHtml(p.text)}</span>
          <button class="pron-play" data-audio="${p.audio}">▶</button>
        </div>`).join('');
    } else if (dict.phonetic) {
      html += `<div class="pron-row"><span class="pron-ipa">${escapeHtml(dict.phonetic)}</span><button class="pron-play" data-tts-id="${entry.id}">▶</button></div>`;
    }

    // Core one-word Korean gloss
    const core = await translateToKorean(entry.text);
    if (core) html += `<div class="pron-core">${escapeHtml(core)}</div>`;

    // Definitions grouped by part of speech (cap 2 POS x 2 defs)
    const meaningsCap = (dict.meanings || []).slice(0, 2);
    for (const m of meaningsCap) {
      const defsCap = m.definitions.slice(0, 2);
      if (defsCap.length === 0) continue;
      const translated = await Promise.all(defsCap.map(d => translateToKorean(d)));
      html += `<div class="pron-pos">${escapeHtml(posLabel(m.partOfSpeech))}</div>`;
      translated.forEach((t, idx) => {
        html += `<div class="pron-def">${idx+1}. ${escapeHtml(t || defsCap[idx])}</div>`;
      });
    }

    // Synonyms / antonyms (cap 5 each), translated
    const allSyn = [...new Set(meaningsCap.flatMap(m => m.synonyms))].slice(0, 5);
    const allAnt = [...new Set(meaningsCap.flatMap(m => m.antonyms))].slice(0, 5);

    if (allSyn.length > 0) {
      const trSyn = await Promise.all(allSyn.map(s => translateToKorean(s)));
      const parts = allSyn.map((s, idx) => `${s}${trSyn[idx] ? `(${trSyn[idx]})` : ''}`);
      html += `<div class="pron-thesaurus"><b>유사어</b> ${escapeHtml(parts.join(', '))}</div>`;
    }
    if (allAnt.length > 0) {
      const trAnt = await Promise.all(allAnt.map(a => translateToKorean(a)));
      const parts = allAnt.map((a, idx) => `${a}${trAnt[idx] ? `(${trAnt[idx]})` : ''}`);
      html += `<div class="pron-thesaurus"><b>반의어</b> ${escapeHtml(parts.join(', '))}</div>`;
    }

    return html;
  }

  entryList.addEventListener('click', async (ev) => {
    const delBtn = ev.target.closest('.delete-btn');
    if (delBtn) {
      entries = entries.filter(e => e.id !== delBtn.dataset.id);
      saveEntries();
      render();
      return;
    }

    const playBtn = ev.target.closest('.pron-play');
    if (playBtn) {
      if (playBtn.dataset.audio) {
        new Audio(playBtn.dataset.audio).play().catch(() => {});
      } else if (playBtn.dataset.ttsId) {
        const entry = entries.find(x => x.id === playBtn.dataset.ttsId);
        if (entry) speak(entry.text, 'en-US');
      }
      return;
    }

    const playAllBtn = ev.target.closest('.pron-playall');
    if (playAllBtn) {
      const panel = playAllBtn.closest('.pron-panel');
      const urls = [...panel.querySelectorAll('.pron-play[data-audio]')].map(b => b.dataset.audio);
      playSequentially(urls);
      return;
    }

    const listenBtn = ev.target.closest('.listen-btn');
    if (listenBtn) {
      const id = listenBtn.dataset.id;
      const entry = entries.find(x => x.id === id);
      if (!entry) return;
      const panel = document.getElementById(`pron-${id}`);

      if (!isWordLookupEligible(entry)) { speak(entry.text, 'en-US'); return; }

      if (panel.dataset.loaded === '1') {
        panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        return;
      }

      const originalLabel = listenBtn.textContent;
      listenBtn.textContent = '⏳ 찾는 중...';
      panel.innerHTML = `<div class="pron-loading">사전과 뜻을 불러오는 중...</div>`;
      panel.style.display = 'block';

      const dict = await lookupWord(entry.text.trim());
      listenBtn.textContent = originalLabel;

      if (dict === undefined) {
        panel.innerHTML = `<div class="pron-note">인터넷 연결을 확인해주세요.</div>`;
        panel.dataset.loaded = '1';
        return;
      }
      if (dict === null) {
        const core = await translateToKorean(entry.text);
        panel.innerHTML = `<div class="pron-note">사전에서 찾지 못했어요.</div>
          ${core ? `<div class="pron-core">${escapeHtml(core)}</div>` : ''}
          <div class="pron-row"><button class="pron-play" data-tts-id="${entry.id}">▶</button><span class="pron-note">읽어주기</span></div>`;
        panel.dataset.loaded = '1';
        return;
      }

      panel.innerHTML = await buildDictPanelHtml(entry, dict);
      panel.dataset.loaded = '1';
    }
  });

  resetBtn.addEventListener('click', () => {
    if (!confirm('모든 기록을 삭제할까요? 되돌릴 수 없어요.')) return;
    entries = [];
    saveEntries();
    render();
  });

  // ---------- Review / flashcard tab ----------
  let reviewFilter = '전체';
  let reviewOrder = [];
  let reviewIndex = 0;
  let reviewRevealed = false;
  let reviewToken = 0;

  const reviewProgress = document.getElementById('reviewProgress');
  const flashcard = document.getElementById('flashcard');
  const flashcardCat = document.getElementById('flashcardCat');
  const flashcardKr = document.getElementById('flashcardKr');
  const flashcardEn = document.getElementById('flashcardEn');
  const flipBtn = document.getElementById('flipBtn');
  const reviewEmpty = document.getElementById('reviewEmpty');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const shuffleBtn = document.getElementById('shuffleBtn');

  document.getElementById('reviewFilterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.filter');
    if (!btn) return;
    reviewFilter = btn.dataset.filter;
    document.querySelectorAll('#reviewFilterTabs .filter').forEach(t => t.classList.toggle('active', t === btn));
    buildReviewOrder();
    renderFlashcard();
  });

  function buildReviewOrder(){
    const pool = reviewFilter === '전체' ? entries : entries.filter(e => e.category === reviewFilter);
    reviewOrder = pool.map(e => e.id);
    reviewIndex = 0;
  }

  function shuffleArray(arr){
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  shuffleBtn.addEventListener('click', () => {
    shuffleArray(reviewOrder);
    reviewIndex = 0;
    renderFlashcard();
  });

  prevBtn.addEventListener('click', () => {
    if (reviewOrder.length === 0) return;
    reviewIndex = (reviewIndex - 1 + reviewOrder.length) % reviewOrder.length;
    renderFlashcard();
  });
  nextBtn.addEventListener('click', () => {
    if (reviewOrder.length === 0) return;
    reviewIndex = (reviewIndex + 1) % reviewOrder.length;
    renderFlashcard();
  });

  flipBtn.addEventListener('click', () => {
    reviewRevealed = !reviewRevealed;
    flashcardEn.style.display = reviewRevealed ? 'block' : 'none';
    flipBtn.textContent = reviewRevealed ? '뜻만 보기' : '정답 보기';
  });

  async function renderFlashcard(){
    reviewToken++;
    const myToken = reviewToken;
    reviewRevealed = false;
    flipBtn.textContent = '정답 보기';
    flashcardEn.style.display = 'none';

    if (reviewOrder.length === 0) {
      flashcard.style.display = 'none';
      document.querySelector('.review-nav').style.display = 'none';
      reviewProgress.textContent = '';
      reviewEmpty.style.display = 'block';
      return;
    }
    flashcard.style.display = '';
    document.querySelector('.review-nav').style.display = '';
    reviewEmpty.style.display = 'none';

    const entry = entries.find(e => e.id === reviewOrder[reviewIndex]);
    if (!entry) return;

    reviewProgress.textContent = `${reviewIndex + 1} / ${reviewOrder.length}`;
    flashcardCat.textContent = entry.category;
    flashcardEn.textContent = entry.text;

    if (entry.memo && entry.memo.trim()) {
      flashcardKr.textContent = entry.memo.trim();
    } else {
      flashcardKr.textContent = '뜻을 불러오는 중...';
      const tr = await translateToKorean(entry.text);
      if (myToken !== reviewToken) return; // user navigated away
      flashcardKr.textContent = tr ? `${tr} (자동 번역)` : '뜻을 가져오지 못했어요';
    }
  }

  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (!isStandalone) installHint.classList.add('show');

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }

  entries = loadEntries();
  render();
})();
</script>
</body>
</html>
